name: Build Vesktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v1.*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm install --global pnpm@11.9.0
      - run: go test ./...
        working-directory: installer
      - run: node scripts/build.mjs
      - name: Smoke test Windows package and bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $profile = Join-Path $env:RUNNER_TEMP 'vesktop-test-profile'
          ./release/golive-vesktop-windows-x64.exe --data-dir $profile --no-launch
          if ($LASTEXITCODE) { throw 'Installation failed' }
          $state = Get-Content (Join-Path $profile 'state.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path (Join-Path $state.vencordDir 'bin/win32-x64/proton-confgen.exe'))) { throw 'Helper missing' }
      - name: Smoke test Linux package and bootstrap syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n install.sh
          ./release/golive-vesktop-linux-x64 --data-dir "$RUNNER_TEMP/vesktop-test-profile" --no-launch
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vesktop-test-profile'
          state = json.loads((p / 'state.json').read_text())
          assert os.access(pathlib.Path(state['vencordDir']) / 'bin/linux-x64/proton-confgen', os.X_OK)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-installer
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v1.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify checksums
        run: cd release && sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
